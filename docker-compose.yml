# Readeck 自定义版 — 飞牛 OS (FnOS) Docker Compose 部署文件
# 独立实例：端口 12233，独立数据目录，不影响你原来的 15351 实例。
#
# 使用方法（在飞牛 SSH 里，进入本文件所在目录后执行）：
#   sudo docker compose pull          # 拉取镜像（首次会自动从 GitHub 下载）
#   sudo docker compose up -d         # 后台启动
#   sudo docker compose ps            # 查看状态
#   sudo docker compose logs -f       # 查看日志（Ctrl+C 退出）
#
# 也可以通过飞牛「Docker 管理」图形界面 → 项目 → 导入本文件 / 粘贴内容来部署。

services:
  readeck:
    # 自定义镜像（含小红书 Cookie 注入、Markdown 导出、视频下载等功能）
    # 镜像由本仓库的 GitHub Actions 自动构建并发布到 GHCR。
    image: ghcr.io/ovohui/readeck:custom

    container_name: readeck-12233
    restart: unless-stopped

    # 端口映射：宿主 12233 -> 容器 8000
    ports:
      - "12233:8000"

    # 数据持久化：./data 是本文件旁的 data 文件夹，存放数据库、Cookie、书签归档
    # 删除容器不会丢数据；升级只需 compose pull && compose up -d。
    volumes:
      - ./data:/readeck

    environment:
      # 自定义功能开关
      READECK_DOWNLOAD_VIDEOS: "true"   # 离线下载视频
      READECK_VIDEO_QUALITY: "720p"     # 清晰度：best / 1080p / 720p / 480p / worst

      # ---- 如果你用域名 + 反向代理访问（如 https://readeck.zh.ovohui.com:12233/），
      #      取消下面两行注释并按需修改；直接 IP:12233 访问则保持注释 ----
      # READECK_SERVER_BASE_URL: "https://readeck.zh.ovohui.com:12233/"
      # READECK_SERVER_TRUSTED_PROXIES: "172.16.0.0/12,127.0.0.0/8"
