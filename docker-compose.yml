# Readeck 自定义版 — 独立实例，端口 12233，不影响你原来的实例
# 部署：把本文件放到 /vol1/1000/docker/readeck-custom/ 后执行：
#   sudo docker compose pull
#   sudo docker compose up -d
version: '3'
services:
  readeck:
    # 用南京大学 GHCR 镜像站，国内可直接拉取（原地址 ghcr.io/ovohui/readeck:custom）
    image: ghcr.nju.edu.cn/ovohui/readeck:custom
    container_name: readeck-12233
    restart: unless-stopped
    ports:
      - 12233:8000
    volumes:
      - ./data:/readeck
    environment:
      - READECK_DOWNLOAD_VIDEOS=true
      - READECK_VIDEO_QUALITY=720p
      # 用容器内置的 yt-dlp + ffmpeg 下载 B 站/YouTube 等播放器里的视频
      - READECK_DOWNLOAD_EMBEDDED_VIDEOS=true
      - READECK_YTDLP_PATH=/usr/local/bin/yt-dlp
      - READECK_YTDLP_MAX_HEIGHT=720
